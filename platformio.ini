; ESP32-S3-DevKitC-1 in the HUB75 adapter board, driving 6 x 128x64 P2 panels
; (128x384) as a stop-light sign. See CLAUDE.md for build/flash/harness.
[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNO_CIE1931          ; linear 8-bit -> 2-bit mapping; the default gamma table turns level 1 into 0
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0

; Bench with only the top two panels attached.
[env:s3-2]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DPANEL_COUNT=2
