; ESP32-S3-DevKitC-1 in the HUB75 adapter board, driving 6 x 128x64 P2 panels
; (128x384) as a stop-light sign. See CLAUDE.md for build/flash/harness.
[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DNO_CIE1931          ; linear 8-bit -> 2-bit mapping; the default gamma table turns level 1 into 0
    -DS3_LCD_DIV_NUM=6    ; pixel clock = 160 MHz / 6 = 26.7 MHz (7 = 22.9 MHz, 5 = 32 MHz)
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0

; Bench with only two loose panels attached (first panel upright).
[env:s3-2]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DPANEL_COUNT=2
    -DFIRST_PANEL_FLIPPED_DEFAULT=0

; MP3 module bring-up: no display, no WiFi, console-driven (see main.cpp MP3_TEST).
[env:s3-mp3test]
extends = env:s3
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DNO_CIE1931
    -DS3_LCD_DIV_NUM=6
    -DARDUINO_USB_CDC_ON_BOOT=1    ; console on whichever socket is plugged: native USB here
    -DMP3_TEST
